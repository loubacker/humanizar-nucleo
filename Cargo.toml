[package]
name = "humanizar-nucleo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bb8-postgres = "0.9.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.31"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto", "use_pem"] }
lapin = "4.10.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1"] }
tokio-util = "0.7.18"
tower-http = { version = "0.7.0", features = ["cors", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
base64 = "0.22.1"
http-body-util = "0.1.3"
rsa = { version = "0.9.10", features = ["getrandom", "pem"] }
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[[test]]
name = "endpoint_contract_test"
path = "tests/infrastructure/controller/endpoint_contract_test.rs"

[[test]]
name = "postgres_contract_test"
path = "tests/infrastructure/persistence/postgres_contract_test.rs"

[[test]]
name = "rabbit_contract_test"
path = "tests/infrastructure/messaging/rabbit_contract_test.rs"

[[test]]
name = "http_observability_test"
path = "tests/infrastructure/diagnostics/http_observability_test.rs"

[[test]]
name = "startup_diagnostics_test"
path = "tests/infrastructure/diagnostics/startup_diagnostics_test.rs"

[[test]]
name = "postgres_race_test"
path = "tests/infrastructure/persistence/postgres_race_test.rs"

[[test]]
name = "nucleo_command_mapper_test"
path = "tests/application/messaging/inbound/mapper/nucleo_command_mapper_test.rs"
